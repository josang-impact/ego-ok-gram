<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>이고그램 · OK그램 체크리스트 (KTAA식)</title>
<style>
  :root{
    --bg:#f4f4f2; --panel:#ffffff; --ink:#1d1d1f; --muted:#6b6b70;
    --line:#d8d8d4; --sel:#1d1d1f;
    --ego:#1f6feb; --ok:#d9480f;
    --bandM:#cfcfca; --bandF:#e6e6e2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:"Noto Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 20px 80px;}
  header h1{font-size:24px;margin:0 0 6px;letter-spacing:-0.3px;}
  header p{margin:0;color:var(--muted);font-size:14px;}

  .tabs{display:flex;gap:6px;margin:22px 0 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .tab{appearance:none;border:none;background:none;cursor:pointer;padding:10px 16px;font-size:15px;font-weight:600;
    color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;}
  .tab.active{color:var(--ink);border-bottom-color:var(--ink);}
  .panel{display:none;} .panel.active{display:block;}

  .scale-guide{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:18px 0;
    font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
  .scale-guide b{color:var(--ink);}

  .q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;
    display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;}
  .q.answered{border-color:#c2cfe0;}
  .q .qtext{flex:1 1 380px;font-size:14.5px;}
  .q .qnum{color:var(--muted);font-weight:700;margin-right:6px;}
  .opts{display:flex;gap:6px;flex:0 0 auto;}
  .opt{appearance:none;border:1px solid var(--line);background:#fafafa;cursor:pointer;width:64px;padding:6px 4px;
    border-radius:8px;text-align:center;font-family:inherit;font-size:11px;color:var(--muted);line-height:1.25;transition:all .12s;}
  .opt .n{display:block;font-size:15px;font-weight:700;color:var(--ink);}
  .opt:hover{border-color:#9aa0a6;}
  .opt.sel{background:var(--sel);border-color:var(--sel);color:#fff;}
  .opt.sel .n{color:#fff;}

  .bar{position:sticky;bottom:0;left:0;right:0;margin-top:22px;background:rgba(244,244,242,.92);backdrop-filter:blur(6px);
    border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .progress{font-size:13px;color:var(--muted);} .progress b{color:var(--ink);}
  button.action{appearance:none;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border-radius:9px;
    padding:10px 18px;border:1px solid var(--ink);}
  button.primary{background:var(--ink);color:#fff;} button.ghost{background:transparent;color:var(--ink);border-color:var(--line);}

  #result{display:none;margin-top:24px;} #result.show{display:block;}
  .result-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;}
  .gender{display:flex;gap:8px;align-items:center;margin-bottom:14px;font-size:13px;color:var(--muted);flex-wrap:wrap;}
  .gbtn{appearance:none;font-family:inherit;border:1px solid var(--line);background:#fafafa;border-radius:8px;
    padding:6px 14px;cursor:pointer;font-size:13px;color:var(--ink);}
  .gbtn.on{background:var(--sel);color:#fff;border-color:var(--sel);}
  .legend{display:flex;gap:18px;justify-content:center;margin-bottom:8px;font-size:12.5px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:7px;}
  .legend i.ln{width:24px;height:0;border-top:3px solid;display:inline-block;}
  .legend i.sw{width:14px;height:11px;border-radius:2px;display:inline-block;border:1px solid #bbb;}
  .legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .totals{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px;justify-content:center;}
  .tot{border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:74px;text-align:center;font-size:12px;color:var(--muted);}
  .tot b{display:block;font-size:19px;color:var(--ink);}
  svg{width:100%;height:auto;display:block;}

  .note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6;}
  .warn{background:#fff7ed;border:1px solid #f3d6b3;color:#9a5a16;border-radius:10px;padding:10px 14px;font-size:13px;margin:14px 0;}

  .interp{margin-top:28px;}
  .interp h3{font-size:19px;margin:0 0 4px;border-left:4px solid var(--ink);padding-left:11px;}
  .interp h4{font-size:15px;margin:26px 0 10px;font-weight:800;}
  .irow{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #efefec;}
  .irow:last-child{border-bottom:0;}
  .iname{flex:0 0 168px;font-weight:700;font-size:13.5px;}
  .iname small{display:block;color:var(--muted);font-weight:500;font-size:11.5px;}
  .ibody{flex:1;font-size:13px;color:#333;}
  .badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 9px;margin-left:2px;}
  .b-high{background:#fdecea;color:#c0392b;} .b-mid{background:#e7f4ea;color:#1e7a36;} .b-low{background:#eaf1fe;color:#1b54b3;}
  .score-big{font-weight:800;font-size:14px;}
  .card2{background:#faf9f7;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:8px;}
  .card2 .ttl{font-weight:800;font-size:14.5px;margin-bottom:6px;}
  .card2 .sub{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .areas{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
  .area{border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12px;background:#fff;min-width:120px;}
  .area.win{border-color:#c0392b;background:#fff4f2;}
  .area b{font-size:14px;}
  .disc{font-size:12px;color:var(--muted);background:#f6f6f4;border-radius:8px;padding:10px 13px;line-height:1.6;}

  @media print{.tabs,.bar,.tab,.action,.gender{display:none!important;} #result{display:block!important;} .panel{display:none!important;}}
  @media (max-width:620px){.iname{flex-basis:100%;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>이고-OK그램 (Ego-OK Gram) 체크리스트</h1>
    <p>KTAA식 · 이고그램 50문항 + OK그램 40문항에 응답하면 꺾은선 그래프와 해석을 보여줍니다.</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="ego">① 이고그램 (50문항)</button>
    <button class="tab" data-tab="ok">② OK그램 (40문항)</button>
    <button class="tab" data-tab="res" id="resTab">③ 결과 · 해석</button>
  </div>

  <section class="panel active" id="panel-ego">
    <div class="scale-guide"><span><b>응답 기준</b></span>
      <span><b>5</b> 매우긍정</span><span><b>4</b> 약간긍정</span><span><b>3</b> 보통</span><span><b>2</b> 약간부정</span><span><b>1</b> 매우부정</span></div>
    <div id="ego-list"></div>
  </section>

  <section class="panel" id="panel-ok">
    <div class="scale-guide"><span><b>응답 기준</b></span>
      <span><b>5</b> 매우긍정</span><span><b>4</b> 약간긍정</span><span><b>3</b> 보통</span><span><b>2</b> 약간부정</span><span><b>1</b> 매우부정</span></div>
    <div id="ok-list"></div>
  </section>

  <section class="panel" id="panel-res">
    <div id="result">
      <div class="result-card">
        <div class="gender">
          <span>평균 비교 기준 성별</span>
          <button class="gbtn" data-g="남">남성</button>
          <button class="gbtn" data-g="여">여성</button>
          <span style="font-size:11.5px">— 그래프의 회색 밴드는 해당 성별 ‘보통(평균)’ 범위입니다.</span>
        </div>
        <div class="legend">
          <span><i class="ln" style="border-color:var(--ego)"></i><span class="dot" style="background:var(--ego)"></span> 이고그램</span>
          <span><i class="ln" style="border-color:var(--ok)"></i><span class="dot" style="background:var(--ok)"></span> OK그램</span>
          <span><i class="sw" style="background:var(--bandM)"></i> 남성 평균(보통)</span>
          <span><i class="sw" style="background:var(--bandF)"></i> 여성 평균(보통)</span>
        </div>
        <div id="chart"></div>
        <div class="totals" id="totals"></div>
        <p class="note" id="editorNote"></p>
      </div>
      <div id="interp" class="interp"></div>
    </div>
  </section>

  <div class="bar">
    <span class="progress" id="progress"></span>
    <span style="flex:1"></span>
    <button class="action ghost" id="resetBtn">초기화</button>
    <button class="action primary" id="drawBtn">결과 · 해석 보기</button>
  </div>
</div>

function renderList(data,prefix,mountId){
  const m=document.getElementById(mountId); m.innerHTML="";
  data.forEach(([num,text])=>{
    const key=prefix+"-"+num;
    const row=document.createElement("div");
    row.className="q"+(ans[key]?" answered":""); row.id="q-"+key;
    const opts=OPT_LABELS.map(o=>`<button class="opt${ans[key]==o.n?' sel':''}" data-key="${key}" data-v="${o.n}"><span class="n">${o.n}</span>${o.t}</button>`).join("");
    row.innerHTML=`<div class="qtext"><span class="qnum">${num}.</span>${text}</div><div class="opts">${opts}</div>`;
    m.appendChild(row);
  });
}
renderList(EGO,"ego","ego-list"); renderList(OK,"ok","ok-list");

document.body.addEventListener("click",(e)=>{
  const b=e.target.closest(".opt"); if(!b)return;
  const key=b.dataset.key,v=+b.dataset.v; ans[key]=v;
  document.querySelectorAll(`.opt[data-key="${key}"]`).forEach(x=>x.classList.toggle("sel",+x.dataset.v===v));
  document.getElementById("q-"+key).classList.add("answered");
  save(); updateProgress();
});
function save(){ localStorage.setItem("egook",JSON.stringify({ans,gender})); }
function counts(){ let e=0,o=0; EGO.forEach(([n])=>{if(ans["ego-"+n])e++;}); OK.forEach(([n])=>{if(ans["ok-"+n])o++;}); return {e,o}; }
function updateProgress(){ const c=counts(); document.getElementById("progress").innerHTML=`이고그램 <b>${c.e}/50</b> · OK그램 <b>${c.o}/40</b> 응답`; }
updateProgress();

    t.classList.add("active"); document.getElementById("panel-"+t.dataset.tab).classList.add("active");

function totals(){
  const ego={CP:0,NP:0,A:0,FC:0,AC:0}, ok={"U-":0,"U+":0,"I+":0,"I-":0};
  EGO.forEach(([n,,c])=>{ if(ans["ego-"+n])ego[c]+=ans["ego-"+n]; });
  OK.forEach(([n,,c])=>{ if(ans["ok-"+n])ok[c]+=ans["ok-"+n]; });
  return {ego,ok};
}
function egoLevel(state,score){ const n=NORMS[gender][state]; if(score<n[0])return -1; if(score>n[1])return 1; return 0; }
function okLevel(score){ if(score<=24)return -1; if(score>=40)return 1; return 0; }
function lvLabel(l){ return l>0?"높음":(l<0?"낮음":"보통"); }
function lvClass(l){ return l>0?"b-high":(l<0?"b-low":"b-mid"); }

const COLS=[
 {key:"CP",ok:"U-",label:"CP",sub:"(U-)",top:["비판적","지배적"],bot:"관용적"},
 {key:"NP",ok:"U+",label:"NP",sub:"(U+)",top:["과보호적","헌신적"],bot:"방임적"},

 {key:"FC",ok:"I+",label:"FC",sub:"(I+)",top:["개구쟁이","개방적"],bot:"폐쇄적"},

];

function drawChart(){
  const {ego,ok}=totals();
  const W=940,H=560,padL=120,padR=60,padT=86,padB=120;
  const plotL=padL,plotR=W-padR,plotT=padT,plotB=H-padB;
  const colW=(plotR-plotL)/COLS.length, vMin=10,vMax=50;
  const y=v=>plotB-(Math.max(vMin,Math.min(vMax,v))-vMin)/(vMax-vMin)*(plotB-plotT);
  const cx=i=>plotL+(i+0.5)*colW;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans KR, sans-serif">`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`;
  s+=`<text x="${(plotL+plotR)/2}" y="34" text-anchor="middle" font-size="19" font-weight="700">당신의 이고-OK그램 (Ego-OK Gram)</text>`;
  for(let v=vMin;v<=vMax;v+=5){ const yy=y(v);
    s+=`<line x1="${plotL}" y1="${yy}" x2="${plotR}" y2="${yy}" stroke="#ededea" stroke-width="1"/>`;
    s+=`<text x="${plotL-12}" y="${yy+4}" text-anchor="end" font-size="11" fill="#888">${v}</text>`; }

  // 남/여 평균(보통) 밴드
  COLS.forEach((c,i)=>{
    const cl=plotL+i*colW, mid=cl+colW/2;
    const mN=NORMS["남"][c.key], fN=NORMS["여"][c.key];
    s+=`<rect x="${cl+5}" y="${y(mN[1])}" width="${colW/2-6}" height="${y(mN[0])-y(mN[1])}" fill="var(--bandM)" opacity="0.85"/>`;
    s+=`<rect x="${mid+1}" y="${y(fN[1])}" width="${colW/2-6}" height="${y(fN[0])-y(fN[1])}" fill="var(--bandF)" opacity="0.9"/>`;
  });
  for(let i=0;i<=COLS.length;i++){ const xx=plotL+i*colW;
    s+=`<line x1="${xx}" y1="${plotT}" x2="${xx}" y2="${plotB}" stroke="#d8d8d4" stroke-width="1"/>`; }
  s+=`<line x1="${plotL}" y1="${plotT}" x2="${plotR}" y2="${plotT}" stroke="#bdbdb8" stroke-width="1.5"/>`;
  s+=`<line x1="${plotL}" y1="${plotB}" x2="${plotR}" y2="${plotB}" stroke="#bdbdb8" stroke-width="1.5"/>`;

  COLS.forEach((c,i)=>{ const x=cx(i);
    s+=`<text x="${x}" y="${plotT-26}" text-anchor="middle" font-size="11" fill="#555">${c.top[0]}</text>`;
    s+=`<text x="${x}" y="${plotT-13}" text-anchor="middle" font-size="11" fill="#555">${c.top[1]}</text>`;
    s+=`<text x="${x}" y="${plotB+22}" text-anchor="middle" font-size="11.5" fill="#555">${c.bot}</text>`;
    s+=`<text x="${x}" y="${plotB+46}" text-anchor="middle" font-size="15" font-weight="700">${c.label}<tspan font-size="11" font-weight="400">${c.sub}</tspan></text>`;
  });
  const groups=[{n:"P",a:0,b:1},{n:"A",a:2,b:2},{n:"C",a:3,b:4}], gy=plotB+60;
  groups.forEach(g=>{ const x1=plotL+g.a*colW+6,x2=plotL+(g.b+1)*colW-6;
    s+=`<line x1="${x1}" y1="${gy}" x2="${x2}" y2="${gy}" stroke="#1d1d1f" stroke-width="1.5"/>`;
    s+=`<text x="${(x1+x2)/2}" y="${gy+18}" text-anchor="middle" font-size="14" font-weight="700">${g.n}</text>`; });

  const egoPts=COLS.map((c,i)=>({x:cx(i),y:y(ego[c.key]),v:ego[c.key],has:ego[c.key]>0}));
  drawLine(egoPts,"var(--ego)");
  const okPts=[0,1,3,4].map(i=>({x:cx(i),y:y(ok[COLS[i].ok]),v:ok[COLS[i].ok],has:ok[COLS[i].ok]>0}));
  drawLine(okPts,"var(--ok)");
  function drawLine(pts,color){
    const valid=pts.filter(p=>p.has);
    if(valid.length>=2){ const d=valid.map((p,k)=>(k?"L":"M")+p.x+" "+p.y).join(" ");
      s+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round"/>`; }
    pts.forEach(p=>{ if(!p.has)return;
      s+=`<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#fff" stroke="${color}" stroke-width="2.4"/>`;
      s+=`<text x="${p.x}" y="${p.y-11}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${color}">${p.v}</text>`; });
  }
  s+=`</svg>`;
  document.getElementById("chart").innerHTML=s;

  let html="";
  COLS.forEach(c=>{ html+=`<div class="tot"><small>${c.label}${c.sub}</small><b>${ego[c.key]}</b>이고그램</div>`; });
  ["U-","U+","I+","I-"].forEach(k=>{ html+=`<div class="tot" style="border-color:#e7c4b3"><small>${k}</small><b style="color:var(--ok)">${ok[k]}</b>OK그램</div>`; });
  document.getElementById("totals").innerHTML=html;
  const c=counts();
  document.getElementById("editorNote").innerHTML=
    `※ 각 척도는 해당 10문항 응답(1~5점)의 합계(10~50점). 회색 밴드 = ${gender==="남"?"남성":"여성"} 등 양 성별 ‘보통(평균)’ 범위(우재현, 2005). `+
    `현재 이고그램 ${c.e}/50, OK그램 ${c.o}/40 응답. 인쇄(⌘P) 또는 캡처로 저장 가능.`;
}

}

function renderInterp(){
  const {ego,ok}=totals(); const c=counts(); const el=document.getElementById("interp");
  let h=`<h3>해석</h3>`;
  if(c.e<50||c.o<40) h+=`<div class="warn">아직 모든 문항에 응답하지 않았습니다 (이고그램 ${c.e}/50, OK그램 ${c.o}/40). 미응답 문항은 0점으로 계산되어 해석이 정확하지 않을 수 있습니다.</div>`;

  // 1. 자아상태별
  h+=`<h4>1. 자아상태별 (이고그램) — ${gender==="남"?"남성":"여성"} 평균 기준</h4>`;
  COLS.forEach(c0=>{ const k=c0.key, sc=ego[k], lv=egoLevel(k,sc);
    const d=lv>0?EGO_INT[k].high:(lv<0?EGO_INT[k].low:EGO_INT[k].mid);
    h+=rowI(EGO_NAME[k],`보통범위 ${NORMS[gender][k][0]}~${NORMS[gender][k][1]}점`,sc,lv,d); });

  // 2. 내 점수 요약 (+ 진짜로 들어맞을 때만 전형 패턴 참고)
  const lvVec=COLS.map(c0=>egoLevel(c0.key,ego[c0.key]));
  const sorted=COLS.map(c0=>({k:c0.key,v:ego[c0.key],lv:egoLevel(c0.key,ego[c0.key])})).sort((a,b)=>b.v-a.v);
  const top=sorted[0], bottom=sorted[sorted.length-1];
  const highs=sorted.filter(x=>x.lv>0).map(x=>x.k);
  const lows=sorted.filter(x=>x.lv<0).map(x=>x.k);
  let summary=`가장 높은 자아상태는 <b>${top.k} (${top.v}점)</b>, 가장 낮은 자아상태는 <b>${bottom.k} (${bottom.v}점)</b>입니다. `;
  if(highs.length) summary+=`평균보다 <b>높은</b> 영역: ${highs.join("·")}. `;
  if(lows.length) summary+=`평균보다 <b>낮은</b> 영역: ${lows.join("·")}. `;
  if(!highs.length&&!lows.length) summary+=`다섯 자아상태가 모두 평균(보통) 범위 안에 있어 비교적 균형 잡힌 형태입니다. `;
  // 엄격 매칭: 패턴이 지정한 높음(+)/낮음(-) 영역이 실제로 모두 그래야만 인정
  const matched=PATTERNS.filter(p=>{ for(let i=0;i<5;i++){ if(p.sig[i]>0&&lvVec[i]<=0)return false; if(p.sig[i]<0&&lvVec[i]>=0)return false; } return true; });
  let bm=null,bd=-1e9; matched.forEach(p=>{ let d=0; for(let i=0;i<5;i++)d+=p.sig[i]*lvVec[i]; if(d>bd){bd=d;bm=p;} });
  h+=`<h4>2. 내 이고그램 점수 요약</h4>`;
  h+=`<div class="card2"><div class="ttl">내 점수 분포</div>${summary}`;
  if(bm){
    h+=`<div style="margin-top:12px;padding-top:12px;border-top:1px solid #eceae6"><b>참고 — 내 점수와 들어맞는 전형 패턴: ${bm.name}</b><br><span style="font-size:12.5px;color:#555">${bm.desc}</span></div>`;
  } else {
    h+=`<div style="margin-top:10px;font-size:12.5px;color:#888">※ 특정 전형 패턴(∧·N·역N·V·W·M·우경사형)에 뚜렷이 해당하지는 않습니다. 위의 ‘내 점수 분포’를 중심으로 해석하세요.</div>`;
  }
  h+=`</div>`;

  // 3. 인생태도별
  h+=`<h4>3. 인생태도별 (OK그램)</h4>`;
  [["I+",ok["I+"]],["I-",ok["I-"]],["U+",ok["U+"]],["U-",ok["U-"]]].forEach(([k,sc])=>{
    const lv=okLevel(sc); const d=lv>0?OK_INT[k].high:(lv<0?OK_INT[k].low:OK_INT[k].mid);
    h+=rowI(OK_NAME[k],"보통범위 25~39점",sc,lv,d); });

  // 4. OK 코랄 영역(면적법)
  h+=`<h4>4. 인생태도 영역 — OK 코랄 (면적법)</h4>`;
  const areas=POSITIONS.map(p=>({p,val:p.calc(ok)})).sort((a,b)=>b.val-a.val);
  const win=areas[0];
  h+=`<div class="card2"><div class="ttl">주된 인생태도 : ${win.p.title}</div>`+
     `<div class="sub">두 점수의 곱(면적)이 가장 넓은 영역이 주된 태도 (윤영진 외, 2016)</div>${win.p.desc}`+
     `<div class="areas">`+areas.map(a=>`<div class="area${a===win?' win':''}">${a.p.title.split(' · ')[0]}<br><b>${a.val.toLocaleString()}</b></div>`).join('')+`</div></div>`;
  // 부등호 기반 표기
  const lp = (ok["I+"]>=ok["I-"]?"자기긍정":"자기부정")+" · "+(ok["U+"]>=ok["U-"]?"타인긍정":"타인부정");
  h+=`<p class="note">점수 비교 기준: I+ ${ok["I+"]} ${ok["I+"]>=ok["I-"]?"≥":"<"} I- ${ok["I-"]}, U+ ${ok["U+"]} ${ok["U+"]>=ok["U-"]?"≥":"<"} U- ${ok["U-"]} → <b>${lp}</b> 경향.</p>`;

  // 5. 통합 해석
  h+=`<h4>5. 통합 해석 (자아상태 ↔ 인생태도)</h4>`;
  const E=(k)=>egoLevel(k,ego[k]); const O=(k)=>okLevel(ok[k]);
  const msgs=[];
  if(E("NP")>=0&&E("A")>=0&&E("FC")>=0&&O("I+")>0&&O("U+")>0)
    msgs.push("NP·A·FC 에너지가 살아 있고 자기긍정(I+)·타인긍정(U+)이 높아 <b>건강한 심리 구조</b>로 볼 수 있습니다. 현재의 강점을 유지·발전시키는 방향이 권장됩니다.");
  if(E("AC")>0&&E("FC")<0&&O("I-")>0)
    msgs.push("AC(순응·억압) 에너지가 강하고 FC가 낮으며 자기부정(I-)이 높습니다. 자신에 대한 부정적 인식과 타인 의존이 함께 나타나기 쉬워, <b>FC 활성화·자기가치감 회복·I+ 강화</b>가 도움이 됩니다.");
  if(E("CP")>0&&E("NP")<0&&O("U-")>0)
    msgs.push("CP(비판적 부모)가 강하고 NP가 낮으며 타인부정(U-)이 높습니다. 타인에 대한 비판·통제 경향이 인생태도에도 반영된 일관된 패턴으로, <b>NP 활성화·타인 수용 경험 확장</b>이 권장됩니다.");
  if(E("CP")>0&&E("AC")>0&&E("NP")<0&&E("FC")<0)
    msgs.push("CP·AC가 높고 NP·FC가 낮은 V형·W형 경향으로, 자유로운 표현과 억압이 동시에 강한 <b>내적 갈등 상태</b>일 수 있습니다. 자기긍정과 자기부정이 혼재할 가능성이 있어 감정 처리·갈등 탐색이 우선 과제입니다.");
  if(!msgs.length) msgs.push("이고그램과 OK그램 결과를 함께 놓고, 일치하는 부분은 핵심 특성으로, 불일치하는 부분은 내면의 갈등·방어의 신호로 살펴보세요. 결과는 고정된 성격이 아니라 ‘현재 경향’이며 상담·노력으로 변화할 수 있습니다.");
  h+=`<div class="card2">`+msgs.map(m=>`<p style="margin:0 0 10px">• ${m}</p>`).join('')+`</div>`;

  h+=`<p class="disc">⚠️ 이 검사는 고정불변의 성격을 단정하는 도구가 아니라 <b>현재의 심적 에너지 배분·인생태도 경향</b>을 보여줍니다. 점수가 높다고 반드시 좋거나 나쁜 것이 아니며, 단일 점수보다 전체 균형·패턴을 종합적으로 보아야 합니다. 정식 해석·상담은 전문가와 함께 진행하세요. (출처: 우재현 2005; 윤영진 외 2016; 장여반·허만세 2025)</p>`;
  el.innerHTML=h;
}

function showResult(){
  drawChart(); renderInterp();
  document.getElementById("result").classList.add("show");
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  document.getElementById("resTab").classList.add("active");
  document.getElementById("panel-res").classList.add("active");
}
function syncGenderBtns(){ document.querySelectorAll(".gbtn").forEach(b=>b.classList.toggle("on",b.dataset.g===gender)); }
syncGenderBtns();
document.querySelectorAll(".gbtn").forEach(b=>b.addEventListener("click",()=>{
  gender=b.dataset.g; save(); syncGenderBtns();
  if(document.getElementById("result").classList.contains("show")){ drawChart(); renderInterp(); }
}));

document.getElementById("drawBtn").addEventListener("click",()=>{ showResult(); window.scrollTo({top:0,behavior:"smooth"}); });
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(!confirm("모든 응답을 지울까요?"))return;
  for(const k in ans)delete ans[k]; localStorage.removeItem("egook");
  renderList(EGO,"ego","ego-list"); renderList(OK,"ok","ok-list"); updateProgress();
  document.getElementById("result").classList.remove("show");
});
</script>
