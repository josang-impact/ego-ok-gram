<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>이고그램 · OK그램 체크리스트 (KTAA식)</title>
<style>
  :root{
    --bg:#f4f4f2;
    --panel:#ffffff;
    --ink:#1d1d1f;
    --muted:#6b6b70;
    --line:#d8d8d4;
    --accent:#2b2b2b;
    --ego:#1f6feb;   /* 이고그램 선 */
    --ok:#d9480f;    /* OK그램 선 */
    --sel:#1d1d1f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:28px 20px 80px;}
  header h1{font-size:24px;margin:0 0 6px;letter-spacing:-0.3px;}
  header p{margin:0;color:var(--muted);font-size:14px;}

  .tabs{display:flex;gap:6px;margin:22px 0 0;border-bottom:1px solid var(--line);}
  .tab{
    appearance:none;border:none;background:none;cursor:pointer;
    padding:10px 16px;font-size:15px;font-weight:600;color:var(--muted);
    border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--ink);}

  .panel{display:none;}
  .panel.active{display:block;}

  .scale-guide{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:12px 16px;margin:18px 0;font-size:13px;color:var(--muted);
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;
  }
  .scale-guide b{color:var(--ink);}

  .q{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;margin-bottom:10px;
    display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;
  }
  .q.answered{border-color:#c2cfe0;}
  .q .qtext{flex:1 1 380px;font-size:14.5px;}
  .q .qnum{color:var(--muted);font-weight:700;margin-right:6px;}
  .opts{display:flex;gap:6px;flex:0 0 auto;}
  .opt{
    appearance:none;border:1px solid var(--line);background:#fafafa;cursor:pointer;
    width:64px;padding:6px 4px;border-radius:8px;text-align:center;font-family:inherit;
    font-size:11px;color:var(--muted);line-height:1.25;transition:all .12s;
  }
  .opt .n{display:block;font-size:15px;font-weight:700;color:var(--ink);}
  .opt:hover{border-color:#9aa0a6;}
  .opt.sel{background:var(--sel);border-color:var(--sel);color:#fff;}
  .opt.sel .n{color:#fff;}

  .bar{
    position:sticky;bottom:0;left:0;right:0;margin-top:22px;
    background:rgba(244,244,242,.92);backdrop-filter:blur(6px);
    border-top:1px solid var(--line);padding:12px 0;
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  }
  .progress{font-size:13px;color:var(--muted);}
  .progress b{color:var(--ink);}
  button.action{
    appearance:none;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
    border-radius:9px;padding:10px 18px;border:1px solid var(--ink);
  }
  button.primary{background:var(--ink);color:#fff;}
  button.ghost{background:transparent;color:var(--ink);border-color:var(--line);}

  /* 결과 */
  #result{display:none;margin-top:30px;}
  #result.show{display:block;}
  .result-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;}
  .legend{display:flex;gap:22px;justify-content:center;margin-bottom:8px;font-size:13px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:7px;}
  .legend i{width:26px;height:0;border-top:3px solid;display:inline-block;}
  .legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .totals{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;justify-content:center;}
  .tot{
    border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:78px;text-align:center;
    font-size:12px;color:var(--muted);
  }
  .tot b{display:block;font-size:20px;color:var(--ink);}
  .tot small{font-size:11px;}

  .note{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.6;}
  svg{width:100%;height:auto;display:block;}
  @media print{ .tabs,.bar,.tab,.action,#editorNote{display:none!important;} #result{display:block!important;} .panel{display:none!important;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>이고-OK그램 (Ego-OK Gram) 체크리스트</h1>
    <p>KTAA식 · 이고그램 50문항 + OK그램 40문항에 응답하면 꺾은선 그래프로 결과를 그려줍니다.</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="ego">① 이고그램 (50문항)</button>
    <button class="tab" data-tab="ok">② OK그램 (40문항)</button>
    <button class="tab" data-tab="res" id="resTab">③ 결과 그래프</button>
  </div>

  <!-- 이고그램 -->
  <section class="panel active" id="panel-ego">
    <div class="scale-guide">
      <span><b>응답 기준</b></span>
      <span><b>5</b> 매우긍정</span><span><b>4</b> 약간긍정</span><span><b>3</b> 보통</span><span><b>2</b> 약간부정</span><span><b>1</b> 매우부정</span>
    </div>
    <div id="ego-list"></div>
  </section>

  <!-- OK그램 -->
  <section class="panel" id="panel-ok">
    <div class="scale-guide">
      <span><b>응답 기준</b></span>
      <span><b>5</b> 매우긍정</span><span><b>4</b> 약간긍정</span><span><b>3</b> 보통</span><span><b>2</b> 약간부정</span><span><b>1</b> 매우부정</span>
    </div>
    <div id="ok-list"></div>
  </section>

  <!-- 결과 -->
  <section class="panel" id="panel-res">
    <div id="result">
      <div class="result-card">
        <div class="legend">
          <span><i style="border-color:var(--ego)"></i><span class="dot" style="background:var(--ego)"></span> 이고그램 (CP·NP·A·FC·AC)</span>
          <span><i style="border-color:var(--ok)"></i><span class="dot" style="background:var(--ok)"></span> OK그램 (U-·U+·I+·I-)</span>
        </div>
        <div id="chart"></div>
        <div class="totals" id="totals"></div>
      </div>
      <p class="note" id="editorNote"></p>
    </div>
  </section>

  <div class="bar">
    <span class="progress" id="progress"></span>
    <span style="flex:1"></span>
    <button class="action ghost" id="resetBtn">초기화</button>
    <button class="action primary" id="drawBtn">결과 그래프 보기</button>
  </div>
</div>

const OPT_LABELS = [
  {n:1,t:"매우부정"},{n:2,t:"약간부정"},{n:3,t:"보통"},{n:4,t:"약간긍정"},{n:5,t:"매우긍정"}
];

const store = JSON.parse(localStorage.getItem("egook") || "{}");
const ans = store.ans || {}; // key: "ego-1" / "ok-1" -> value 1..5

/* ===== 문항 렌더링 ===== */
function renderList(data, prefix, mountId){
  const m = document.getElementById(mountId);
  m.innerHTML = "";
  data.forEach(([num, text])=>{
    const key = prefix+"-"+num;
    const row = document.createElement("div");
    row.className = "q" + (ans[key] ? " answered":"");
    row.id = "q-"+key;
    const opts = OPT_LABELS.map(o=>
      `<button class="opt${ans[key]==o.n?' sel':''}" data-key="${key}" data-v="${o.n}">
         <span class="n">${o.n}</span>${o.t}</button>`).join("");
    row.innerHTML = `<div class="qtext"><span class="qnum">${num}.</span>${text}</div>
                     <div class="opts">${opts}</div>`;
    m.appendChild(row);
  });
}
renderList(EGO,"ego","ego-list");
renderList(OK,"ok","ok-list");

/* ===== 선택 처리 ===== */
document.body.addEventListener("click",(e)=>{
  const b = e.target.closest(".opt");
  if(!b) return;
  const key=b.dataset.key, v=+b.dataset.v;
  ans[key]=v;
  // 같은 행의 버튼 갱신
  document.querySelectorAll(`.opt[data-key="${key}"]`).forEach(x=>x.classList.toggle("sel", +x.dataset.v===v));
  document.getElementById("q-"+key).classList.add("answered");
  save(); updateProgress();
});

function save(){ localStorage.setItem("egook", JSON.stringify({ans})); }

function counts(){
  let e=0,o=0;
  EGO.forEach(([n])=>{ if(ans["ego-"+n]) e++; });
  OK.forEach(([n])=>{ if(ans["ok-"+n]) o++; });
  return {e,o};
}
function updateProgress(){
  const c=counts();
  document.getElementById("progress").innerHTML =
    `이고그램 <b>${c.e}/50</b> · OK그램 <b>${c.o}/40</b> 응답`;
}
updateProgress();

/* ===== 탭 ===== */
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("panel-"+t.dataset.tab).classList.add("active");
    window.scrollTo({top:0,behavior:"smooth"});
  });
});

/* ===== 집계 ===== */
function totals(){
  const ego={CP:0,NP:0,A:0,FC:0,AC:0};
  const ok={"U-":0,"U+":0,"I+":0,"I-":0};
  EGO.forEach(([n,,cat])=>{ if(ans["ego-"+n]) ego[cat]+=ans["ego-"+n]; });
  OK.forEach(([n,,cat])=>{ if(ans["ok-"+n]) ok[cat]+=ans["ok-"+n]; });
  return {ego,ok};
}

/* ===== 그래프 ===== */
const COLS = [
  {key:"CP", ok:"U-", label:"CP", sub:"(U-)", top:["비판적","지배적"], bot:"관용적", group:"P"},
  {key:"NP", ok:"U+", label:"NP", sub:"(U+)", top:["과보호적","헌신적"], bot:"방임적", group:"P"},
  {key:"A",  ok:null, label:"A",  sub:"",     top:["기계적","현실적"],  bot:"즉흥적", group:"A"},
  {key:"FC", ok:"I+", label:"FC", sub:"(I+)", top:["개구쟁이","개방적"], bot:"폐쇄적", group:"C"},
  {key:"AC", ok:"I-", label:"AC", sub:"(I-)", top:["자기비하","의존적"], bot:"독단적", group:"C"},
];

function drawChart(){
  const {ego,ok}=totals();
  const W=940, H=560;
  const padL=120, padR=60, padT=86, padB=120;
  const plotL=padL, plotR=W-padR, plotT=padT, plotB=H-padB;
  const colW=(plotR-plotL)/COLS.length;
  const vMin=10, vMax=50;
  const y=v=>plotB-(v-vMin)/(vMax-vMin)*(plotB-plotT);
  const cx=i=>plotL+(i+0.5)*colW;

  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans KR, sans-serif">`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`;
  s+=`<text x="${(plotL+plotR)/2}" y="34" text-anchor="middle" font-size="19" font-weight="700">당신의 이고-OK그램 (Ego-OK Gram)</text>`;

  // 가로 눈금선 + 라벨
  for(let v=vMin; v<=vMax; v+=5){
    const yy=y(v);
    s+=`<line x1="${plotL}" y1="${yy}" x2="${plotR}" y2="${yy}" stroke="#e6e6e2" stroke-width="1"/>`;
    s+=`<text x="${plotL-12}" y="${yy+4}" text-anchor="end" font-size="11" fill="#888">${v}</text>`;
  }
  // 세로 구분선
  for(let i=0;i<=COLS.length;i++){
    const xx=plotL+i*colW;
    s+=`<line x1="${xx}" y1="${plotT}" x2="${xx}" y2="${plotB}" stroke="#d8d8d4" stroke-width="1"/>`;
  }
  s+=`<line x1="${plotL}" y1="${plotT}" x2="${plotR}" y2="${plotT}" stroke="#bdbdb8" stroke-width="1.5"/>`;
  s+=`<line x1="${plotL}" y1="${plotB}" x2="${plotR}" y2="${plotB}" stroke="#bdbdb8" stroke-width="1.5"/>`;

  // 상단/하단 성향 라벨
  COLS.forEach((c,i)=>{
    const x=cx(i);
    s+=`<text x="${x}" y="${plotT-26}" text-anchor="middle" font-size="11" fill="#555">${c.top[0]}</text>`;
    s+=`<text x="${x}" y="${plotT-13}" text-anchor="middle" font-size="11" fill="#555">${c.top[1]}</text>`;
    s+=`<text x="${x}" y="${plotB+22}" text-anchor="middle" font-size="11.5" fill="#555">${c.bot}</text>`;
  });

  // 컬럼 헤더 (CP(U-) 등)
  COLS.forEach((c,i)=>{
    const x=cx(i), yh=plotB+46;
    s+=`<text x="${x}" y="${yh}" text-anchor="middle" font-size="15" font-weight="700">${c.label}<tspan font-size="11" font-weight="400">${c.sub}</tspan></text>`;
  });
  // 그룹 바 (P / A / C)
  const groups=[{n:"P",a:0,b:1},{n:"A",a:2,b:2},{n:"C",a:3,b:4}];
  const gy=plotB+60;
  groups.forEach(g=>{
    const x1=plotL+g.a*colW+6, x2=plotL+(g.b+1)*colW-6;
    s+=`<line x1="${x1}" y1="${gy}" x2="${x2}" y2="${gy}" stroke="#1d1d1f" stroke-width="1.5"/>`;
    s+=`<text x="${(x1+x2)/2}" y="${gy+18}" text-anchor="middle" font-size="14" font-weight="700">${g.n}</text>`;
  });

  // ----- 이고그램 선 (5점) -----
  const egoPts=COLS.map((c,i)=>({x:cx(i), y:y(clamp(ego[c.key])), v:ego[c.key], has:ego[c.key]>0}));
  drawLine(egoPts, "var(--ego)");

  // ----- OK그램 선 (4점, A 제외) -----
  const okIdx=[0,1,3,4];
  const okPts=okIdx.map(i=>({x:cx(i), y:y(clamp(ok[COLS[i].ok])), v:ok[COLS[i].ok], has:ok[COLS[i].ok]>0}));
  drawLine(okPts, "var(--ok)");

  function clamp(v){ return Math.max(vMin, Math.min(vMax, v||vMin)); }
  function drawLine(pts, color){
    const valid=pts.filter(p=>p.has);
    if(valid.length>=2){
      const d=valid.map((p,k)=>(k?"L":"M")+p.x+" "+p.y).join(" ");
      s+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round"/>`;
    }
    pts.forEach(p=>{
      if(!p.has) return;
      s+=`<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#fff" stroke="${color}" stroke-width="2.4"/>`;
      s+=`<text x="${p.x}" y="${p.y-11}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${color}">${p.v}</text>`;
    });
  }

  s+=`</svg>`;
  document.getElementById("chart").innerHTML=s;

  // 합계 표
  const tt=document.getElementById("totals");
  let html="";
  COLS.forEach(c=>{
    html+=`<div class="tot"><small>${c.label}${c.sub}</small><b>${ego[c.key]}</b>이고그램</div>`;
  });
  ["U-","U+","I+","I-"].forEach(k=>{
    html+=`<div class="tot" style="border-color:#e7c4b3"><small>${k}</small><b style="color:var(--ok)">${ok[k]}</b>OK그램</div>`;
  });
  tt.innerHTML=html;

  const c=counts();
  document.getElementById("editorNote").innerHTML =
    `※ 각 척도는 해당 10문항 응답(1~5점)의 합계이며 범위는 10~50점입니다. `+
    `현재 이고그램 ${c.e}/50, OK그램 ${c.o}/40 응답 — 미응답 문항은 0점으로 계산됩니다. `+
    `그래프는 인쇄(⌘P) 또는 화면 캡처로 저장할 수 있습니다.`;
}

/* ===== 버튼 ===== */
document.getElementById("drawBtn").addEventListener("click",()=>{
  drawChart();
  document.getElementById("result").classList.add("show");
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  document.getElementById("resTab").classList.add("active");
  document.getElementById("panel-res").classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
});

document.getElementById("resetBtn").addEventListener("click",()=>{
  if(!confirm("모든 응답을 지울까요?")) return;
  for(const k in ans) delete ans[k];
  localStorage.removeItem("egook");
  renderList(EGO,"ego","ego-list");
  renderList(OK,"ok","ok-list");
  updateProgress();
  document.getElementById("result").classList.remove("show");
});
</script>
</body>
</html>
